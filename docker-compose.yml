version: "3.8"

services:
  web:
    build: .
    container_name: server-php-saya
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db-mysql-kuliah
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rahasia
      MYSQL_DATABASE: db_kuliah
